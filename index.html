<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(14px, 2.5vw, 20px);
      color: #94a3b8;
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
      font-family: monospace;
    }
    .display-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh);
      font-weight: 900;
      line-height: 1;
      color: #00e676;
      font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh);
      font-weight: 700;
      color: #64748b;
      margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 16px 42px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    #connectBtn:active {
      transform: scale(0.96);
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">點擊下方按鈕連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleScan()">連線 SPIKE 藍牙</button>
  </div>

  <script>
    const PYBRICKS_SERVICE_UUID = "c5f50001-8280-46da-89f4-6d8051e4aeef";
    const PYBRICKS_EVENT_CHAR_UUID = "c5f50003-8280-46da-89f4-6d8051e4aeef";

    let bluetoothDevice = null;
    let rxBuffer = "";

    async function toggleScan() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "Pybricks" },
            { namePrefix: "SPIKE" },
            { services: [PYBRICKS_SERVICE_UUID] }
          ],
          optionalServices: [PYBRICKS_SERVICE_UUID]
        });

        status.innerText = `正在連接：${bluetoothDevice.name || "Hub"}...`;
        btn.innerText = "連線中...";

        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
        const eventChar = await service.getCharacteristic(PYBRICKS_EVENT_CHAR_UUID);

        await eventChar.startNotifications();
        eventChar.addEventListener("characteristicvaluechanged", handleRawData);

        status.innerText = "連線成功！請按一下 Hub 中央鍵啟動程式";
        btn.innerText = "已連線 (即時接收中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        btn.innerText = "連線 SPIKE 藍牙";
        console.error("連線錯誤：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    // 寬容度最高的原始位元組串流解碼
    function handleRawData(event) {
      const value = event.target.value;
      if (value.byteLength < 1) return;

      // 直接將接收到的 Byte 陣列轉換為文字
      const rawBytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
      const decodedText = new TextDecoder("utf-8", { fatal: false }).decode(rawBytes);

      // 累加到文字緩衝區
      rxBuffer += decodedText;

      // 於頂端狀態列即時顯示接收到的原始字元（除錯用）
      const status = document.getElementById("statusText");
      
      // 當緩衝區包含換行或長度超過 4 字元時進行數值提取
      if (rxBuffer.includes("\n") || rxBuffer.length >= 8) {
        const lines = rxBuffer.split(/\r?\n/);
        rxBuffer = lines.pop(); // 保留最後一筆未換行的片段

        for (let i = lines.length - 1; i >= 0; i--) {
          const line = lines[i].trim();
          if (!line) continue;

          // 抓取包含小數點的連續數字
          const match = line.match(/\d+(\.\d+)?/);
          if (match) {
            const val = parseFloat(match[0]);
            if (!isNaN(val) && val >= 0 && val <= 400) {
              const displayEl = document.getElementById("distVal");
              displayEl.innerText = val.toFixed(1);
              displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
              status.innerText = `即時數據：${val.toFixed(1)} cm`;
              break;
            }
          }
        }
      }
    }
  </script>
</body>
</html>
