<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    /* 改用安全的垂直彈性排版，由上到下，保證每一項都在畫面上 */
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(16px, 3vw, 24px);
      color: #94a3b8;
      text-align: center;
    }
    .display-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #distVal {
      font-size: min(40vw, 35vh);
      font-weight: 900;
      line-height: 1;
      color: #00e676; /* 正常綠色 */
      font-variant-numeric: tabular-nums;
      transition: color 0.15s ease;
    }
    .unit {
      font-size: min(10vw, 10vh);
      font-weight: 700;
      color: #64748b;
      margin-left: 15px;
    }
    /* 實心藍色連線大按鈕，清晰明顯 */
    #connectBtn {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 16px 40px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }
    #connectBtn:active {
      background: #1d4ed8;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- 1. 上方狀態列 -->
    <div id="statusText">等待連線 SPIKE...</div>

    <!-- 2. 中間超大數字 -->
    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <!-- 3. 下方醒目按鈕（絕對固定在視窗內） -->
    <button id="connectBtn" onclick="connectSpike()">連線 SPIKE 藍牙</button>
  </div>

  <script>
    // 你的 Google Apps Script 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyBcO3DwbDfPySPUc7Zf4WeF1T4mpT4N1MlfpChd10SOI3DMlCxQuyeqHDtCa9SQbqRpw/exec";

    // Pybricks 專用 Nordic UART Service UUID
    const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const NUS_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let rxBuffer = "";
    let lastUploadTime = 0;
    const UPLOAD_INTERVAL = 1000; // 每 1 秒上傳一筆

    async function connectSpike() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋附近所有藍牙裝置...";
        
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID]
        });

        status.innerText = `正在連線至 ${device.name || "裝置"}...`;
        btn.innerText = "連線中...";

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        const txChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);

        await txChar.startNotifications();
        txChar.addEventListener("characteristicvaluechanged", handleData);

        // 連線成功：按鈕保留，文字改為綠色「已連線」
        btn.innerText = "已連線（點擊可重連）";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";
        status.innerText = `連線成功：${device.name || "Pybricks Hub"}`;

        device.addEventListener("gattserverdisconnected", () => {
          btn.innerText = "重新連線 SPIKE";
          btn.style.background = "#2563eb";
          btn.style.borderColor = "#3b82f6";
          status.innerText = "連線已中斷";
          document.getElementById("distVal").innerText = "--.-";
          document.getElementById("distVal").style.color = "#ffffff";
        });

      } catch (err) {
        btn.innerText = "連線 SPIKE 藍牙";
        status.innerText = "連線失敗: " + err.message;
        console.error("藍牙連線錯誤：", err);
      }
    }

    function handleData(event) {
      const text = new TextDecoder().decode(event.target.value);
      rxBuffer += text;
      const lines = rxBuffer.split("\n");

      if (lines.length > 1) {
        const val = parseFloat(lines[lines.length - 2].trim());
        rxBuffer = lines[lines.length - 1];

        if (!isNaN(val)) {
          const displayEl = document.getElementById("distVal");
          displayEl.innerText = val.toFixed(1);
          displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";

          const now = Date.now();
          if (now - lastUploadTime >= UPLOAD_INTERVAL) {
            lastUploadTime = now;
            uploadToSheet(val);
          }
        }
      }
    }

    function uploadToSheet(distance) {
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ distance: distance })
      }).catch(err => console.error("上傳失敗：", err));
    }
  </script>
</body>
</html>
