<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(16px, 3vw, 24px);
      color: #94a3b8;
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }
    .display-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh);
      font-weight: 900;
      line-height: 1;
      color: #00e676; /* 正常綠色 */
      font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh);
      font-weight: 700;
      color: #64748b;
      margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 16px 42px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    #connectBtn:active {
      transform: scale(0.96);
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">請點擊下方按鈕開始連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleScan()">連線並開始測距</button>
  </div>

  <script>
    // 定義 Pybricks 原生與常見藍牙服務 UUID
    const PYBRICKS_SERVICE_UUID = "c5f50001-8280-46da-89f4-6d8051e4aeef";
    const PYBRICKS_EVENT_CHAR_UUID = "c5f50003-8280-46da-89f4-6d8051e4aeef";
    const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice = null;

    async function toggleScan() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋附近的 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        // 開放權限通道，防止被瀏覽器 GATT 阻擋
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "Pybricks" },
            { namePrefix: "SPIKE" },
            { services: [PYBRICKS_SERVICE_UUID] }
          ],
          optionalServices: [
            PYBRICKS_SERVICE_UUID,
            NUS_SERVICE_UUID,
            "generic_access"
          ]
        });

        status.innerText = `正在連接：${bluetoothDevice.name || "Hub"}...`;
        btn.innerText = "建立 GATT 連線...";

        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        // 建立連線
        const server = await bluetoothDevice.gatt.connect();

        status.innerText = "連線成功，正在掛載資料通道...";
        
        // 嘗試取得 Pybricks 專屬事件通知
        try {
          const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
          const char = await service.getCharacteristic(PYBRICKS_EVENT_CHAR_UUID);
          await char.startNotifications();
          char.addEventListener("characteristicvaluechanged", handlePybricksData);
        } catch (e) {
          console.warn("無法開啟 Pybricks 原生通道，嘗試以通用模式監聽", e);
        }

        status.innerText = "即時測距中（連線成功）";
        btn.innerText = "已連線 (即時更新中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        btn.innerText = "連線並開始測距";
        console.error("藍牙連線錯誤詳情：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    function handlePybricksData(event) {
      const dataView = event.target.value;
      if (dataView.byteLength < 3) return;

      // 提取數值（第倒數 2 個 bytes）
      const rawInt = dataView.getInt16(dataView.byteLength - 2, true);
      const distCm = rawInt / 10.0;

      if (!isNaN(distCm) && distCm >= 0 && distCm <= 400) {
        const displayEl = document.getElementById("distVal");
        displayEl.innerText = distCm.toFixed(1);
        displayEl.style.color = (distCm <= 10) ? "#ff5252" : "#00e676";
      }
    }
  </script>
</body>
</html>
