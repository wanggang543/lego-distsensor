<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(16px, 3vw, 24px);
      color: #94a3b8;
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }
    .display-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh);
      font-weight: 900;
      line-height: 1;
      color: #00e676;
      font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh);
      font-weight: 700;
      color: #64748b;
      margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 16px 42px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    #connectBtn:active {
      transform: scale(0.96);
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">請點擊下方按鈕開始連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleScan()">連線並開始測距</button>
  </div>

  <script>
    // Pybricks 專屬服務 UUID
    const PYBRICKS_SERVICE_UUID = "c5f50001-8280-46da-89f4-6d8051e4aeef";
    const PYBRICKS_COMMAND_CHAR_UUID = "c5f50002-8280-46da-89f4-6d8051e4aeef"; // 下達啟動指令
    const PYBRICKS_EVENT_CHAR_UUID = "c5f50003-8280-46da-89f4-6d8051e4aeef";   // 接收 print 數據

    let bluetoothDevice = null;
    let rxBuffer = "";

    async function toggleScan() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "Pybricks" },
            { namePrefix: "SPIKE" },
            { services: [PYBRICKS_SERVICE_UUID] }
          ],
          optionalServices: [PYBRICKS_SERVICE_UUID]
        });

        status.innerText = `正在連接：${bluetoothDevice.name || "Hub"}...`;
        btn.innerText = "建立 GATT 連線...";

        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        status.innerText = "連線成功，正在掛載資料通道與啟動程式...";

        const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
        const commandChar = await service.getCharacteristic(PYBRICKS_COMMAND_CHAR_UUID);
        const eventChar = await service.getCharacteristic(PYBRICKS_EVENT_CHAR_UUID);

        // 1. 先開啟數據監聽
        await eventChar.startNotifications();
        eventChar.addEventListener("characteristicvaluechanged", handlePybricksData);

        // 2.【關鍵核心】：發送「啟動程式指令」讓 Hub 燈號開始轉動！
        // Pybricks Start User Program 指令代碼為 0x00
        const startCommand = new Uint8Array([0x00]);
        await commandChar.writeValueWithResponse(startCommand);

        status.innerText = "即時測距中（Hub 程式已啟動）";
        btn.innerText = "已連線 (即時更新中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線/啟動失敗: " + err.message;
        btn.innerText = "連線並開始測距";
        console.error("錯誤詳情：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    // 解析 Pybricks 丟出的 stdout 終端文字串流
    function handlePybricksData(event) {
      const dataView = event.target.value;
      if (dataView.byteLength < 1) return;

      // Pybricks Event 封包：第一個 byte 是事件類型 (0x01 代表 stdout 印出的文字)
      const eventType = dataView.getUint8(0);
      
      // 取出文字 payload
      const textChunk = new Uint8Array(dataView.buffer, dataView.byteOffset + 1);
      const decoded = new TextDecoder().decode(textChunk);
      rxBuffer += decoded;

      // 依換行符號切出最新一筆數值
      if (rxBuffer.includes("\n")) {
        const lines = rxBuffer.split(/\r?\n/);
        rxBuffer = lines.pop();

        for (let i = lines.length - 1; i >= 0; i--) {
          const cleanStr = lines[i].trim();
          if (!cleanStr) continue;

          const match = cleanStr.match(/[0-9]+(\.[0-9]+)?/);
          if (match) {
            const val = parseFloat(match[0]);
            if (!isNaN(val) && val >= 0 && val <= 400) {
              updateDisplay(val);
              break;
            }
          }
        }
      }
    }

    function updateDisplay(val) {
      const displayEl = document.getElementById("distVal");
      displayEl.innerText = val.toFixed(1);
      displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
    }
  </script>
</body>
</html>
