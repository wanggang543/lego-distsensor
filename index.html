<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; overflow: hidden;
    }
    .app-wrapper {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(14px, 2.5vw, 20px);
      color: #38bdf8; text-align: center;
      max-width: 90%; line-height: 1.4;
      font-family: monospace;
    }
    .display-container {
      display: flex; align-items: baseline; justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh); font-weight: 900; line-height: 1;
      color: #00e676; font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh); font-weight: 700;
      color: #64748b; margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb; color: #ffffff; border: 2px solid #3b82f6;
      padding: 16px 42px; font-size: clamp(18px, 3vw, 24px);
      font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    #connectBtn:active { transform: scale(0.96); background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">點擊下方按鈕開始連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleConnect()">連線 SPIKE 藍牙</button>
  </div>

  <script>
    const PYBRICKS_SERVICE_UUID = "c5f50001-8280-46da-89f4-6d8051e4aeef";
    const PYBRICKS_EVENT_CHAR_UUID = "c5f50003-8280-46da-89f4-6d8051e4aeef";

    let bluetoothDevice = null;
    let rxBuffer = "";

    async function toggleConnect() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [PYBRICKS_SERVICE_UUID, "generic_access"]
        });

        status.innerText = `連線中：${bluetoothDevice.name || "Hub"}...`;
        btn.innerText = "建立連線...";

        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        status.innerText = "連線成功，正在掛載資料特徵值...";

        const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
        const eventChar = await service.getCharacteristic(PYBRICKS_EVENT_CHAR_UUID);

        // 啟動 Pybricks 事件監聽
        await eventChar.startNotifications();
        eventChar.addEventListener("characteristicvaluechanged", handleEventData);

        status.innerText = "✅ 通道掛載完成！請按一下 Hub 中央鍵啟動測距";
        btn.innerText = "已連線 (即時接收中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        btn.innerText = "連線 SPIKE 藍牙";
        console.error("藍牙連線錯誤：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    function handleEventData(event) {
      const dataView = event.target.value;
      if (dataView.byteLength < 2) return;

      // Pybricks 規範：Byte 0 為事件類型，0x01 為 stdout 終端文字
      const eventType = dataView.getUint8(0);
      
      // 取出文字 Payload (Byte 1 之後)
      const textChunk = new Uint8Array(dataView.buffer, dataView.byteOffset + 1);
      const decoded = new TextDecoder("utf-8").decode(textChunk);
      rxBuffer += decoded;

      // 遇換行符號即分割出數值
      if (rxBuffer.includes("\n")) {
        const lines = rxBuffer.split(/\r?\n/);
        rxBuffer = lines.pop(); // 保留尚未完結的片段

        for (let i = lines.length - 1; i >= 0; i--) {
          const line = lines[i].trim();
          if (!line) continue;

          // 抓取帶有小數點的數字
          const match = line.match(/\d+(\.\d+)?/);
          if (match) {
            const val = parseFloat(match[0]);
            if (!isNaN(val) && val >= 0 && val <= 400) {
              updateDisplay(val);
              break;
            }
          }
        }
      }
    }

    function updateDisplay(val) {
      const displayEl = document.getElementById("distVal");
      displayEl.innerText = val.toFixed(1);
      displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
      document.getElementById("statusText").innerText = `⚡ 即時數值：${val.toFixed(1)} cm`;
    }
  </script>
</body>
</html>
