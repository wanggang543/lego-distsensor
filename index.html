<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .app-wrapper {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 15px;
    }
    #statusText {
      font-size: 16px; color: #38bdf8; text-align: center;
      font-family: monospace;
    }
    .display-container {
      display: flex; align-items: baseline; justify-content: center;
    }
    #distVal {
      font-size: min(35vw, 28vh); font-weight: 900; line-height: 1;
      color: #00e676; font-variant-numeric: tabular-nums;
    }
    .unit { font-size: min(8vw, 8vh); font-weight: 700; color: #64748b; margin-left: 10px; }
    #connectBtn {
      background: #2563eb; color: #ffffff; border: 2px solid #3b82f6;
      padding: 14px 36px; font-size: 18px; font-weight: bold;
      border-radius: 40px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    #connectBtn:active { transform: scale(0.96); background: #1d4ed8; }
    /* 黑色監控黑盒子 */
    #monitorBox {
      width: 95%; max-width: 600px; height: 130px;
      background: #111827; border: 1px solid #374151;
      border-radius: 8px; padding: 10px; font-family: monospace;
      font-size: 13px; color: #a7f3d0; overflow-y: auto;
      text-align: left;
    }
    .log-item { border-bottom: 1px solid #1f2937; padding: 2px 0; word-break: break-all; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">請點擊下方按鈕開始連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <!-- 監控視窗 -->
    <div id="monitorBox">
      <div style="color: #9ca3af;">[系統狀態] 頁面載入完成，等待點擊連線...</div>
    </div>

    <!-- 不在標籤上寫 onclick，改用標準 id 綁定 -->
    <button id="connectBtn" type="button">連線 SPIKE 藍牙</button>
  </div>
