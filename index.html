<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(16px, 3vw, 24px);
      color: #94a3b8;
      text-align: center;
    }
    .display-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh);
      font-weight: 900;
      line-height: 1;
      color: #00e676; /* 正常綠色 */
      font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh);
      font-weight: 700;
      color: #64748b;
      margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 16px 42px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }
    #connectBtn:active {
      transform: scale(0.96);
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">請點擊下方按鈕開始監聽</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleScan()">連線並開始測距</button>
  </div>

  <script>
    // Pybricks 官方專屬藍牙服務 UUID
    const PYBRICKS_SERVICE_UUID = "c5f50001-8280-46da-89f4-6d8051e4aeef";
    const PYBRICKS_EVENT_CHAR_UUID = "c5f50003-8280-46da-89f4-6d8051e4aeef";

    let bluetoothDevice = null;
    let eventCharacteristic = null;

    async function toggleScan() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        // 搜尋 Pybricks Hub
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [PYBRICKS_SERVICE_UUID]
        });

        status.innerText = `正在連接：${bluetoothDevice.name || "Pybricks Hub"}...`;
        btn.innerText = "連線中...";

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
        eventCharacteristic = await service.getCharacteristic(PYBRICKS_EVENT_CHAR_UUID);

        // 啟動原生廣播/通知監聽
        await eventCharacteristic.startNotifications();
        eventCharacteristic.addEventListener("characteristicvaluechanged", handlePybricksData);

        status.innerText = "即時測距中（連線成功）";
        btn.innerText = "已連線 (即時接收中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

        bluetoothDevice.addEventListener("gattserverdisconnected", () => {
          status.innerText = "連線已中斷";
          btn.innerText = "重新連線 SPIKE";
          btn.style.background = "#2563eb";
          btn.style.borderColor = "#3b82f6";
          document.getElementById("distVal").innerText = "--.-";
          document.getElementById("distVal").style.color = "#ffffff";
        });

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        btn.innerText = "連線並開始測距";
        console.error(err);
      }
    }

    // 解析 Pybricks 廣播與事件封包
    function handlePybricksData(event) {
      const dataView = event.target.value;
      if (dataView.byteLength < 1) return;

      // 檢查是否為廣播資料事件 (Pybricks Broadcast Event ID 通常為 0x01)
      const eventId = dataView.getUint8(0);
      
      // 當接收到資料 payload
      if (dataView.byteLength >= 3) {
        // 從封包最後 2 個 bytes 還原出傳遞的整數
        const rawInt = dataView.getInt16(dataView.byteLength - 2, true);
        const distCm = rawInt / 10.0;

        if (!isNaN(distCm) && distCm >= 0 && distCm <= 400) {
          updateDisplay(distCm);
        }
      }
    }

    function updateDisplay(val) {
      const displayEl = document.getElementById("distVal");
      displayEl.innerText = val.toFixed(1);
      // 小於等於 10 cm 轉為醒目警示紅字，否則維持綠字
      displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
    }
  </script>
</body>
</html>
