<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; overflow: hidden;
    }
    .app-wrapper {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly;
      padding: 20px 10px;
    }
    #statusText {
      font-size: clamp(14px, 2.5vw, 20px);
      color: #38bdf8; text-align: center;
      max-width: 90%; line-height: 1.4;
      font-family: monospace;
    }
    .display-container {
      display: flex; align-items: baseline; justify-content: center;
    }
    #distVal {
      font-size: min(42vw, 36vh); font-weight: 900; line-height: 1;
      color: #00e676; font-variant-numeric: tabular-nums;
      transition: color 0.1s ease;
    }
    .unit {
      font-size: min(10vw, 10vh); font-weight: 700;
      color: #64748b; margin-left: 15px;
    }
    #connectBtn {
      background: #2563eb; color: #ffffff; border: 2px solid #3b82f6;
      padding: 16px 42px; font-size: clamp(18px, 3vw, 24px);
      font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    #connectBtn:active { transform: scale(0.96); background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">點擊下方按鈕連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <button id="connectBtn" onclick="toggleConnect()">連線 SPIKE 藍牙</button>
  </div>

  <script>
    // 使用標準 Nordic UART Service (MicroPython print 專用通道)
    const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const NUS_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 具備 Notify 權限

    let bluetoothDevice = null;
    let rxBuffer = "";

    async function toggleConnect() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";
        btn.innerText = "搜尋配對中...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID, "generic_access"]
        });

        status.innerText = `連接中：${bluetoothDevice.name || "Hub"}...`;
        btn.innerText = "建立連線...";

        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        status.innerText = "連線成功，正在掛載 UART 輸出通道...";

        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        const txChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);

        // 啟動真正具備 Notify 屬性的 TX 特徵值
        await txChar.startNotifications();
        txChar.addEventListener("characteristicvaluechanged", handleUartData);

        status.innerText = "✅ UART 通道已就緒！請按一下 Hub 中央鍵啟動測距";
        btn.innerText = "已連線 (即時接收中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        btn.innerText = "連線 SPIKE 藍牙";
        console.error("連線錯誤詳情：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    // 接收 print() 的文字串流
    function handleUartData(event) {
      const value = event.target.value;
      if (value.byteLength < 1) return;

      const decoded = new TextDecoder("utf-8").decode(value);
      rxBuffer += decoded;

      if (rxBuffer.includes("\n")) {
        const lines = rxBuffer.split(/\r?\n/);
        rxBuffer = lines.pop(); // 保留尚未結尾的片段

        for (let i = lines.length - 1; i >= 0; i--) {
          const line = lines[i].trim();
          if (!line) continue;

          const match = line.match(/\d+(\.\d+)?/);
          if (match) {
            const val = parseFloat(match[0]);
            if (!isNaN(val) && val >= 0 && val <= 400) {
              const displayEl = document.getElementById("distVal");
              displayEl.innerText = val.toFixed(1);
              displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
              document.getElementById("statusText").innerText = `⚡
