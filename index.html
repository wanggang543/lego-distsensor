<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE 即時測距看板 (診斷版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .app-wrapper {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 15px;
    }
    #statusText {
      font-size: 16px; color: #38bdf8; text-align: center;
      font-family: monospace;
    }
    .display-container {
      display: flex; align-items: baseline; justify-content: center;
    }
    #distVal {
      font-size: min(35vw, 28vh); font-weight: 900; line-height: 1;
      color: #00e676; font-variant-numeric: tabular-nums;
    }
    .unit { font-size: min(8vw, 8vh); font-weight: 700; color: #64748b; margin-left: 10px; }
    #connectBtn {
      background: #2563eb; color: #ffffff; border: 2px solid #3b82f6;
      padding: 12px 30px; font-size: 18px; font-weight: bold;
      border-radius: 40px; cursor: pointer;
    }
    /* 訊號診斷黑盒子 */
    #monitorBox {
      width: 95%; max-width: 600px; height: 130px;
      background: #111827; border: 1px solid #374151;
      border-radius: 8px; padding: 10px; font-family: monospace;
      font-size: 13px; color: #a7f3d0; overflow-y: auto;
      text-align: left;
    }
    .log-item { border-bottom: 1px solid #1f2937; padding: 2px 0; word-break: break-all; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div id="statusText">點擊下方按鈕開始連線</div>

    <div class="display-container">
      <span id="distVal">--.-</span>
      <span class="unit">cm</span>
    </div>

    <!-- 即時字串監聽窗 -->
    <div id="monitorBox">
      <div style="color: #9ca3af;">[監聽狀態] 尚未接收到任何字串或封包...</div>
    </div>

    <button id="connectBtn" type="button" onclick="handleConnectClick()">連線 SPIKE 藍牙</button>
  </div>

  <script>
    const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const NUS_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice = null;
    let rxBuffer = "";
    let packetCount = 0;

    function addLog(text) {
      const box = document.getElementById("monitorBox");
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerText = `[#${packetCount}] 收到：${text}`;
      box.insertBefore(item, box.firstChild);
      if (box.children.length > 25) box.removeChild(box.lastChild);
    }

    async function handleConnectClick() {
      const status = document.getElementById("statusText");

      if (!navigator.bluetooth) {
        alert("瀏覽器未支援 Web Bluetooth，請使用 HTTPS 與 Chrome/Edge/Bluefy");
        return;
      }

      try {
        status.innerText = "正在搜尋 SPIKE Hub...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID, "generic_access"]
        });

        status.innerText = `連接中：${bluetoothDevice.name || "Hub"}...`;
        bluetoothDevice.addEventListener("gattserverdisconnected", onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        status.innerText = "連線成功，正在掛載 UART 通道...";

        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        const txChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);

        await txChar.startNotifications();
        txChar.addEventListener("characteristicvaluechanged", handleUartData);

        status.innerText = "✅ 監聽已就緒！請按一下 Hub 中央鍵啟動測距";
        const btn = document.getElementById("connectBtn");
        btn.innerText = "已連線 (監聽中)";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#059669";

      } catch (err) {
        status.innerText = "連線失敗: " + err.message;
        console.error("連線錯誤：", err);
      }
    }

    function onDisconnected() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("statusText");
      status.innerText = "連線已中斷";
      btn.innerText = "重新連線 SPIKE";
      btn.style.background = "#2563eb";
      btn.style.borderColor = "#3b82f6";
      document.getElementById("distVal").innerText = "--.-";
      document.getElementById("distVal").style.color = "#ffffff";
    }

    function handleUartData(event) {
      packetCount++;
      const value = event.target.value;
      if (value.byteLength < 1) return;

      // 1. 純文字解碼
      const textChunk = new TextDecoder("utf-8").decode(value);
      rxBuffer += textChunk;

      // 2. 將原始收到的文字直接印在監聽黑盒子中 (將換行符號視覺化顯示)
      const visibleChunk = textChunk.replace(/\r/g, "\\r").replace(/\n/g, "\\n");
      addLog(`"${visibleChunk}"`);

      // 3. 數值解析邏輯
      if (rxBuffer.includes("\n")) {
        const lines = rxBuffer.split(/\r?\n/);
        rxBuffer = lines.pop();

        for (let i = lines.length - 1; i >= 0; i--) {
          const line = lines[i].trim();
          if (!line) continue;

          const match = line.match(/\d+(\.\d+)?/);
          if (match) {
            const val = parseFloat(match[0]);
            if (!isNaN(val) && val >= 0 && val <= 400) {
              const displayEl = document.getElementById("distVal");
              displayEl.innerText = val.toFixed(1);
              displayEl.style.color = (val <= 10) ? "#ff5252" : "#00e676";
              document.getElementById("statusText").innerText = `⚡ 即時數值：${val.toFixed(1)} cm (總封包: ${packetCount})`;
              break;
            }
          }
        }
      }
    }
  </script>
</body>
</html>
